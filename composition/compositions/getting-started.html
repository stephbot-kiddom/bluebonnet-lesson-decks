  <body>
    <template>
      <style>
      :root {
        --ink: #16202b;
        --muted: #52606d;
        --navy: #0d2b4e;
        --blue-700: #1c4f82;
        --blue-500: #2f74b5;
        --blue-100: #e3edf8;
        --blue-50: #f5f9fd;
        --white: #ffffff;
        --amber: #f2a93c;
        --amber-deep: #c97f10;
      }
      * {

      }

      .pad {

        padding: 110px 160px;

      .attribution-wrap {

      .closing-wrap {
        display: flex;

      }
      .closing-wrap span {
        font-size: 56px;
        font-weight: 600;
        letter-spacing: 0.18em;
        color: #c7d6e8;
      }
      /* ---- Interactive "drag the point" circle-measuring widget ---- */
      .gs-section {
        display: flex;
        align-items: center;
        gap: 56px;
        height: 100%;
      }
      .gs-copy {
        flex: 0 0 720px;
      }
      .gs-copy .headline {
        font-size: 58px;
        max-width: 700px;
      }
      .gs-copy .body-text {
        font-size: 33px;
        max-width: 680px;
        margin-top: 22px;
      }
      .gs-hint {
        margin-top: 26px;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        font-size: 26px;
        font-weight: 700;
        color: var(--amber-deep);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .gs-hint .gs-hint-icon {
        display: inline-block;

        font-size: 30px;
      }
      @keyframes gsHintBob {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(10px);
        }
      }
      .gs-stage {
        position: relative;
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: radial-gradient(circle at 32% 28%, #ffffff 0%, var(--blue-50) 72%);
        border-radius: 40px;
        box-shadow:
          0 30px 70px -30px rgba(13, 43, 78, 0.35),
          inset 0 0 0 2px var(--blue-100);
        padding: 36px;
        height: 760px;
      }
      .gs-stage svg {
        width: 560px;
        height: 560px;
        overflow: visible;
        flex: 0 0 auto;
      }
      .gs-tick {
        stroke: var(--blue-100);
        stroke-width: 5;
      }
      .gs-tick.is-lit {
        stroke: var(--amber);
      }
      .gs-progress-arc {
        fill: none;
        stroke: var(--amber);
        stroke-width: 15;
        stroke-linecap: round;
        filter: drop-shadow(0 0 10px rgba(242, 169, 60, 0.65));
      }
      .gs-radius-line {
        stroke: var(--blue-700);
        stroke-width: 6;
      }
      .gs-base-circle {
        fill: none;
        stroke: var(--blue-500);
        stroke-width: 8;
      }
      .gs-guide-ring {
        fill: none;
        stroke: var(--blue-100);
        stroke-width: 2;
        stroke-dasharray: 4 10;
      }
      .gs-center-dot {
        fill: var(--blue-700);
      }
      .gs-center-halo {
        fill: none;
        stroke: var(--blue-700);
        opacity: 0.35;
        stroke-width: 3;
        transform-origin: 320px 320px;
        animation: gsBreathe 2.4s ease-in-out infinite;
      }
      @keyframes gsBreathe {
        0%,
        100% {
          transform: scale(0.85);
          opacity: 0.35;
        }
        50% {
          transform: scale(1.35);
          opacity: 0;
        }
      }
      .gs-handle {
        fill: #ffffff;
        stroke: var(--amber);
        stroke-width: 7;
        cursor: grab;
        filter: drop-shadow(0 8px 16px rgba(13, 43, 78, 0.35));
        touch-action: none;
      }
      .gs-handle:active,
      .gs-handle.is-dragging {
        cursor: grabbing;
        r: 27;
      }
      .gs-hint-ring {
        fill: none;
        stroke: var(--amber);
        stroke-width: 3;
        stroke-dasharray: 6 8;
        opacity: 0.9;
      }
      .gs-ping {
        fill: none;
        stroke: var(--amber);
        stroke-width: 4;
        pointer-events: none;
      }
      .gs-radius-tag {
        font-size: 26px;
        font-weight: 700;
        fill: var(--blue-700);
      }
      .gs-hud {
        display: flex;
        gap: 36px;
        flex: 0 0 auto;
      }
      .gs-stat {
        background: #ffffff;
        border-radius: 18px;
        padding: 16px 28px;
        box-shadow: 0 14px 30px -18px rgba(13, 43, 78, 0.4);
        text-align: center;
        min-width: 230px;
      }
      .gs-stat .gs-stat-label {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .gs-stat .gs-stat-value {
        margin-top: 6px;
        font-size: 40px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--blue-700);
      }
      .gs-stat.gs-stat-live .gs-stat-value {
        color: var(--amber-deep);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: var(--white);
        color: var(--ink);
      }
      </style>

      <div
        id="root"
        data-composition-id="getting-started"
        data-width="1920"
        data-height="1080"
        data-duration="8"
      >
        <section class="clip pad gs-section" id="getting-started-clip" data-start="0" data-duration="8" data-track-index="1">
          <div class="gs-copy">
            <span class="badge-pill">Engage</span>
            <h1 class="headline" style="margin-top: 28px">
              Measure the distance around a circle and the distance from its center to its edge.
            </h1>
            <p class="body-text">
              Use a string and a centimeter ruler to measure the distance around Circle O. Then draw
              a line from a point on the circle to the center, and measure that too.
            </p>
            <span class="gs-hint" id="gs-hint">
              <span class="gs-hint-icon">&#8594;</span> Drag the point around the circle
            </span>
          </div>

          <div class="gs-stage">
            <svg id="gs-svg" viewBox="0 0 640 640">
              <circle class="gs-guide-ring" cx="320" cy="320" r="266" />
              <g id="gs-ticks"></g>
              <circle class="gs-base-circle" cx="320" cy="320" r="230" />
              <path id="gs-progress-arc" class="gs-progress-arc" d="" />
              <line id="gs-radius-line" class="gs-radius-line" x1="320" y1="320" x2="320" y2="90" />
              <text id="gs-radius-tag" class="gs-radius-tag" x="300" y="195">r &asymp; 2.3 cm</text>
              <circle class="gs-center-halo" cx="320" cy="320" r="10" />
              <circle class="gs-center-dot" cx="320" cy="320" r="11" />
              <circle id="gs-hint-ring" class="gs-hint-ring" cx="320" cy="90" r="40" />
              <circle id="gs-handle" class="gs-handle" cx="320" cy="90" r="22" />
            </svg>

            <div class="gs-hud">
              <div class="gs-stat">
                <div class="gs-stat-label">Radius (center to edge)</div>
                <div class="gs-stat-value">2.3 cm</div>
              </div>
              <div class="gs-stat gs-stat-live">
                <div class="gs-stat-label">Distance traveled around</div>
                <div class="gs-stat-value"><span id="gs-distance">1.9</span> cm</div>
              </div>
            </div>
          </div>
        </section>
      </div>
      <script>
        (function () {
          const svg = document.getElementById("gs-svg");
          // The host re-seeks this sub-composition every time its slide becomes
          // visible again, which can re-run this script. Guard so a revisit never
          // rebuilds tick marks or leaves stray ping circles from a prior run.
          if (svg.dataset.hfInit === "true") return;
          svg.dataset.hfInit = "true";

          const cx = 320,
            cy = 320,
            R = 230;
          const circumferenceCm = 14.4; // matches Circle O's measured value, Activity 1.2
          const handle = document.getElementById("gs-handle");
          const hintRing = document.getElementById("gs-hint-ring");
          const hint = document.getElementById("gs-hint");
          const radiusLine = document.getElementById("gs-radius-line");
          const progressArc = document.getElementById("gs-progress-arc");
          const distanceEl = document.getElementById("gs-distance");
          const ticksGroup = document.getElementById("gs-ticks");
          const TICK_COUNT = 36;
          const ticks = [];

          for (let i = 0; i < TICK_COUNT; i++) {
            const a = (i / TICK_COUNT) * Math.PI * 2 - Math.PI / 2;
            const x1 = cx + Math.cos(a) * (R - 16);
            const y1 = cy + Math.sin(a) * (R - 16);
            const x2 = cx + Math.cos(a) * (R + 2);
            const y2 = cy + Math.sin(a) * (R + 2);
            const tick = document.createElementNS("http://www.w3.org/2000/svg", "line");
            tick.setAttribute("class", "gs-tick");
            tick.setAttribute("x1", x1);
            tick.setAttribute("y1", y1);
            tick.setAttribute("x2", x2);
            tick.setAttribute("y2", y2);
            ticksGroup.appendChild(tick);
            ticks.push({ angle: a, el: tick });
          }

          function normalizeSweep(a) {
            let s = a + Math.PI / 2;
            while (s < 0) s += Math.PI * 2;
            while (s >= Math.PI * 2) s -= Math.PI * 2;
            return s;
          }

          function render(angle, sweep) {
            const hx = cx + Math.cos(angle) * R;
            const hy = cy + Math.sin(angle) * R;
            handle.setAttribute("cx", hx);
            handle.setAttribute("cy", hy);
            hintRing.setAttribute("cx", hx);
            hintRing.setAttribute("cy", hy);
            radiusLine.setAttribute("x2", hx);
            radiusLine.setAttribute("y2", hy);

            const midAngle = angle - Math.PI / 4;
            const tagR = R * 0.5;
            const tagX = cx + Math.cos(midAngle) * tagR - 10;
            const tagY = cy + Math.sin(midAngle) * tagR;
            document.getElementById("gs-radius-tag").setAttribute("x", tagX);
            document.getElementById("gs-radius-tag").setAttribute("y", tagY);

            const startX = cx,
              startY = cy - R;
            const sweepDeg = (sweep * 180) / Math.PI;
            const largeArc = sweepDeg > 180 ? 1 : 0;
            const clampedSweep = Math.min(sweep, Math.PI * 2 - 0.001);
            const ex = cx + Math.cos(clampedSweep - Math.PI / 2) * R;
            const ey = cy + Math.sin(clampedSweep - Math.PI / 2) * R;
            progressArc.setAttribute(
              "d",
              sweep > 0.001 ? `M ${startX} ${startY} A ${R} ${R} 0 ${largeArc} 1 ${ex} ${ey}` : "",
            );

            ticks.forEach((t) => {
              const tNorm = normalizeSweep(t.angle);
              t.el.classList.toggle("is-lit", tNorm <= sweep + 0.001);
            });

            const distance = (sweep / (Math.PI * 2)) * circumferenceCm;
            distanceEl.textContent = distance.toFixed(1);
          }

          let dragging = false;
          let lastTickStep = -1;

          function ping(x, y) {
            // Driven by GSAP (not a CSS @keyframes animation): this engine renders
            // via deterministic seeks, not elapsed browser time, so a CSS animation's
            // `animationend` event is not guaranteed to fire — that left permanent
            // stray circles on screen. A GSAP tween's onComplete always runs.
            const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            c.setAttribute("class", "gs-ping");
            c.setAttribute("cx", x);
            c.setAttribute("cy", y);
            c.setAttribute("r", 24);
            c.setAttribute("opacity", "0.9");
            svg.appendChild(c);
            gsap.to(c, {
              attr: { r: 60 },
              opacity: 0,
              duration: 0.55,
              ease: "power2.out",
              onComplete: () => c.remove(),
            });
          }

          function pointFromEvent(evt) {
            const pt = svg.createSVGPoint();
            pt.x = evt.clientX;
            pt.y = evt.clientY;
            const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
            return loc;
          }

          function handleMove(evt) {
            if (!dragging) return;
            const p = pointFromEvent(evt);
            const angle = Math.atan2(p.y - cy, p.x - cx);
            const sweep = normalizeSweep(angle);
            render(angle, sweep);

            const step = Math.floor(sweep / (Math.PI / 3));
            if (step !== lastTickStep) {
              lastTickStep = step;
              const hx = cx + Math.cos(angle) * R;
              const hy = cy + Math.sin(angle) * R;
              ping(hx, hy);
            }
          }

          function dismissHint() {
            hint.style.opacity = "0";
            hintRing.style.opacity = "0";
          }

          handle.addEventListener("pointerdown", (evt) => {
            dragging = true;
            handle.classList.add("is-dragging");
            handle.setPointerCapture(evt.pointerId);
            dismissHint();
            handleMove(evt);
          });
          handle.addEventListener("pointermove", handleMove);
          handle.addEventListener("pointerup", (evt) => {
            dragging = false;
            handle.classList.remove("is-dragging");
            handle.releasePointerCapture(evt.pointerId);
          });
          handle.addEventListener("pointercancel", () => {
            dragging = false;
            handle.classList.remove("is-dragging");
          });

          // Draws itself in on first load so the slide reads as alive, not static.
          const introStart = -Math.PI / 2;
          const target = -Math.PI / 2 + (50 * Math.PI) / 180; // 50deg clockwise from top
          let introStarted = false;
          const introState = { t: 0 };
          function runIntro() {
            if (introStarted) return;
            introStarted = true;
            gsap.to(introState, {
              t: 1,
              duration: 0.9,
              ease: "power3.out",
              onUpdate: () => {
                const angle = introStart + (target - introStart) * introState.t;
                render(angle, normalizeSweep(angle));
              },
            });
          }
          render(introStart, 0);
          const io = new IntersectionObserver(
            (entries) => {
              entries.forEach((e) => {
                if (e.isIntersecting) runIntro();
              });
            },
            { threshold: 0.2 },
          );
          io.observe(svg);
          // Fallback in case this iframe never reports intersection (e.g. always-rendered engine).
          setTimeout(runIntro, 1200);
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          document.querySelector("#root .clip").children,
          { y: 24 },
          { y: 0, duration: 0.6, stagger: 0.12, ease: "power2.out" },
          0,
        );
        window.__timelines["getting-started"] = tl;
      </script>
    </template>
  </body>
</html>
