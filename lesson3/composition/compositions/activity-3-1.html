<div class="context-box"><p class="context-line">A friend gave you 120 feet of fencing. You decide to fence in a portion of the backyard for your dog. You want to maximize the amount of fenced land.</p></div>
<p class="question-text">1. Draw a diagram, label the dimensions, and compute the maximum fenced area. Assume the fence is free-standing and you are not using any existing structure.</p>
<div class="fence-widget">
  <svg id="fw-svg" viewBox="0 0 640 560">
    <text class="fw-fixed-label" x="320" y="402" text-anchor="middle">Perimeter fixed at 120 ft</text>

    <rect id="fw-rect" class="fw-rect" x="0" y="0" width="0" height="0" />
    <text id="fw-w-label" class="fw-dim-label" x="320" y="0" text-anchor="middle">w = 30 ft</text>

      <script>
        (function () {
          const svg = document.getElementById("fw-svg");
          // Guard: the host re-seeks this sub-composition whenever the slide
          // becomes visible again, which can re-run this script. Without this
          // guard a revisit would re-attach listeners and restart the intro tween.
          if (svg.dataset.hfInit === "true") return;
          svg.dataset.hfInit = "true";

          const CX = 320,
            CY = 210;
          const PX_PER_FT = 5;
          const TRACK_X1 = 170,
            TRACK_X2 = 470,
            TRACK_Y = 440;
          const MIN_W = 5,
            MAX_W = 55;

          const rect = document.getElementById("fw-rect");
          const wLabel = document.getElementById("fw-w-label");
          const hLabel = document.getElementById("fw-h-label");
          const handle = document.getElementById("fw-handle");
          const hintRing = document.getElementById("fw-hint-ring");
          const hintArrow = document.getElementById("fw-hint-arrow");
          const circleGroup = document.getElementById("fw-circle-group");
          const toggle = document.getElementById("fw-toggle");
          const toggleDot = document.getElementById("fw-toggle-dot");

          function widthToHandleX(widthFt) {
            const t = (widthFt - MIN_W) / (MAX_W - MIN_W);
            return TRACK_X1 + t * (TRACK_X2 - TRACK_X1);
          }

          function render(widthFt) {
            const heightFt = 60 - widthFt;
            const w = widthFt * PX_PER_FT;
            const h = heightFt * PX_PER_FT;
            const x = CX - w / 2;
            const y = CY - h / 2;

            rect.setAttribute("x", x);
            rect.setAttribute("y", y);
            rect.setAttribute("width", w);
            rect.setAttribute("height", h);

            wLabel.setAttribute("x", CX);
            wLabel.setAttribute("y", y + h + 30);
            wLabel.textContent = `w = ${widthFt.toFixed(1)} ft`;

            hLabel.setAttribute("x", x - 14);
            hLabel.setAttribute("y", CY + 6);
            hLabel.textContent = `h = ${heightFt.toFixed(1)} ft`;

            const hx = widthToHandleX(widthFt);
            handle.setAttribute("cx", hx);
            hintRing.setAttribute("cx", hx);
          }

          function widthFromClientX(clientX) {
            const pt = svg.createSVGPoint();
            pt.x = clientX;
            pt.y = 0;
            const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
            let t = (loc.x - TRACK_X1) / (TRACK_X2 - TRACK_X1);
            t = Math.max(0, Math.min(1, t));
            return MIN_W + t * (MAX_W - MIN_W);
          }

          let dragging = false;
          let hintDismissed = false;
          let hintTween = null;

          function dismissHint() {
            if (hintDismissed) return;
            hintDismissed = true;
            if (hintTween) hintTween.kill();
            gsap.to([hintRing, hintArrow], { opacity: 0, duration: 0.3, ease: "power1.out" });
          }

          handle.addEventListener("pointerdown", (evt) => {
            dragging = true;
            handle.classList.add("is-dragging");
            handle.setPointerCapture(evt.pointerId);
            if (introTween) introTween.kill();
            dismissHint();
            render(widthFromClientX(evt.clientX));
          });
          handle.addEventListener("pointermove", (evt) => {
            if (!dragging) return;
            render(widthFromClientX(evt.clientX));
          });
          handle.addEventListener("pointerup", (evt) => {
            dragging = false;
            handle.classList.remove("is-dragging");
            handle.releasePointerCapture(evt.pointerId);
          });
          handle.addEventListener("pointercancel", () => {
            dragging = false;
            handle.classList.remove("is-dragging");
          });

          let circleOn = false;
          toggle.addEventListener("pointerdown", () => {
            circleOn = !circleOn;
            toggleDot.classList.toggle("is-on", circleOn);
            gsap.to(circleGroup, {
              opacity: circleOn ? 1 : 0,
              duration: 0.4,
              ease: "power2.out",
            });
          });

          // One-time "drag me" affordance: pulsing ring around the handle,
          // dismissed via a GSAP opacity tween (never a CSS transition) on
          // the first pointer interaction.
          hintTween = gsap.to(hintRing, {
            attr: { r: 34 },
            opacity: 0,
            duration: 0.9,
            ease: "power1.out",
            repeat: 5,
            onRepeat: () => {
              hintRing.setAttribute("r", 26);
              hintRing.style.opacity = 1;
            },
          });

          // Draws itself in shortly after the slide becomes visible: handle
          // sweeps from one end of the track to roughly the square position.
          let introTween = null;
          let introStarted = false;
          const introState = { w: MIN_W };
          function runIntro() {
            if (introStarted) return;
            introStarted = true;
            introTween = gsap.to(introState, {
              w: 30,
              duration: 1,
              ease: "power3.out",
              onUpdate: () => render(introState.w),
            });
          }

          render(MIN_W);
          const io = new IntersectionObserver(
            (entries) => {
              entries.forEach((e) => {
                if (e.isIntersecting) runIntro();
              });
            },
            { threshold: 0.2 },
          );
          io.observe(svg);
          // Fallback in case this iframe never reports intersection (e.g. always-rendered engine).
          setTimeout(runIntro, 1200);
        })();
      </script>
