      <div

        <section class="clip pad" id="activity-1-1-q1-clip" data-start="0" data-duration="8" data-track-index="1">
<span class="badge-pill">Develop</span>
          <p class="question-text">1. Follow the given steps to investigate how a circle is formed.</p>
          <div class="q1-layout">
            <div class="q1-steps">
              <div class="steps-columns"><div class="step-col">
                  <div class="step-label">Step 1</div>
                  <p class="step-text">In the space provided, draw a point and label the point A.</p>
                </div><div class="step-col">
                  <div class="step-label">Step 2</div>
                  <p class="step-text">Use a centimeter ruler to locate and draw a second point that is exactly 5 cm from point A. Label this point B.</p>
                </div><div class="step-col">
                  <div class="step-label">Step 3</div>
                  <p class="step-text">Locate a third point that is exactly 5 cm from point A. Label this point C.</p>
                </div><div class="step-col">
                  <div class="step-label">Step 4</div>
                  <p class="step-text">Repeat this process until you have drawn at least ten distinct points that are each exactly 5 cm from point A.</p>
                </div></div>
            </div>
            <div class="q1-widget">
              <div class="cw-stage-wrap">
                <svg class="cw-svg" viewBox="0 0 640 520" id="cw-stage">
                  <circle class="cw-hint-ring" cx="320" cy="260" r="40"></circle>
                  <text class="cw-hint-text" x="320" y="470">Click anywhere to place a point</text>
                  <circle class="cw-reveal-circle" cx="320" cy="260" r="190" opacity="0"></circle>
                  <text class="cw-reveal-label" x="320" y="42" opacity="0">Every point you could place at this distance from A forms a circle</text>
                  <g class="cw-points"></g>
                  <circle class="cw-point-a" cx="320" cy="260" r="10"></circle>
                  <text class="cw-label-a" x="320" y="232">A</text>
                </svg>
              </div>
              <div class="cw-controls">
                <span class="cw-counter">Points placed: 0</span>
                <button type="button" class="cw-clear-btn">Clear points</button>
              </div>
            </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          document.querySelector("#root .clip").children,
          { y: 24 },
          { y: 0, duration: 0.6, stagger: 0.12, ease: "power2.out" },
          0,
        );
        window.__timelines["activity-1-1-q1"] = tl;
      </script>
      <script>
        (function () {
          const svg = document.getElementById("cw-stage");
          if (!svg || svg.dataset.hfInit === "true") return;
          svg.dataset.hfInit = "true";

          const root = svg.closest("#root") || document;
          const hintRing = svg.querySelector(".cw-hint-ring");
          const hintText = svg.querySelector(".cw-hint-text");
          const revealCircle = svg.querySelector(".cw-reveal-circle");
          const revealLabel = svg.querySelector(".cw-reveal-label");
          const pointsGroup = svg.querySelector(".cw-points");
          const counterEl = root.querySelector(".cw-counter");
          const clearBtn = root.querySelector(".cw-clear-btn");

          const CX = 320;
          const CY = 260;
          const R = 190;
          const REVEAL_THRESHOLD = 10;
          const MAX_LABELED = 6;

          let points = [];
          let hintDismissed = false;
          let revealed = false;

          const hintPulse = gsap.to(hintRing, {
            attr: { r: 55 },
            opacity: 0.15,
            duration: 1,
            repeat: 200,
            yoyo: true,
            ease: "sine.inOut",
          });

          function dismissHint() {
            if (hintDismissed) return;
            hintDismissed = true;
            hintPulse.kill();
            gsap.to([hintRing, hintText], { opacity: 0, duration: 0.4, ease: "power1.out" });
          }

          function clientToSvgPoint(evt) {
            const pt = svg.createSVGPoint();
            pt.x = evt.clientX;
            pt.y = evt.clientY;
            const ctm = svg.getScreenCTM();
            if (!ctm) return { x: CX, y: CY };
            const sp = pt.matrixTransform(ctm.inverse());
            return { x: sp.x, y: sp.y };
          }

          function addPoint(angle) {
            const x = CX + R * Math.cos(angle);
            const y = CY + R * Math.sin(angle);
            const index = points.length + 1;

            const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            dot.setAttribute("class", "cw-point-dot");
            dot.setAttribute("cx", x);
            dot.setAttribute("cy", y);
            dot.setAttribute("r", 9);
            pointsGroup.appendChild(dot);

            if (index <= MAX_LABELED) {
              const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
              label.setAttribute("class", "cw-point-label");
              const letter = String.fromCharCode(66 + (index - 1));
              const labelOffsetX = x >= CX ? x + 18 : x - 18;
              const labelOffsetY = y >= CY ? y + 6 : y - 12;
              label.setAttribute("x", labelOffsetX);
              label.setAttribute("y", labelOffsetY);
              label.textContent = letter;
              pointsGroup.appendChild(label);
            }

            gsap.fromTo(
              dot,
              { attr: { r: 0 } },
              { attr: { r: 9 }, duration: 0.3, ease: "back.out(2)" },
            );

            points.push({ dot });
            counterEl.textContent = "Points placed: " + points.length;

            if (!revealed && points.length >= REVEAL_THRESHOLD) {
              revealed = true;
              gsap.to(revealCircle, { opacity: 1, duration: 0.8, ease: "power1.out" });
              gsap.to(revealLabel, { opacity: 1, duration: 0.8, delay: 0.2, ease: "power1.out" });
            }
          }

          svg.addEventListener("click", function (evt) {
            if (!hintDismissed) dismissHint();
            const sp = clientToSvgPoint(evt);
            const angle = Math.atan2(sp.y - CY, sp.x - CX);
            addPoint(angle);
          });

          clearBtn.addEventListener("click", function (evt) {
            evt.stopPropagation();
            while (pointsGroup.firstChild) {
              pointsGroup.removeChild(pointsGroup.firstChild);
            }
            points = [];
            counterEl.textContent = "Points placed: 0";
            if (revealed) {
              revealed = false;
              gsap.to([revealCircle, revealLabel], { opacity: 0, duration: 0.4, ease: "power1.out" });
            }
          });
        })();
      </script>
