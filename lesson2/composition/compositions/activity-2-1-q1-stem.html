      <div
        id="root"
        data-composition-id="activity-2-1-q1-stem"
        data-width="1920"
        data-height="1080"
        data-duration="8"
      >
        <section class="clip pad" id="activity-2-1-q1-stem-clip" data-start="0" data-duration="8" data-track-index="1">
          <span class="badge-pill">Develop</span>
          <div class="context-box">
            <p class="context-line">In the last lesson, you derived formulas for the distance around a circle. In this lesson, you will investigate the space within a circle. Use the circle divided into 4, 8, and 16 equal parts.</p>
          </div>
          
          <div class="ww-wrap">
            <div class="ww-stage-box">
              <svg id="ww-svg" viewBox="0 0 860 520">
                <text id="ww-live-label" class="ww-label-text" x="430" y="46">Circle</text>

                <g id="ww-states"></g>

                <g id="ww-annotations" style="opacity: 0">
                  <line class="ww-anno-line" x1="330" y1="400" x2="530" y2="400" />
                  <line class="ww-anno-line" x1="330" y1="394" x2="330" y2="406" />
                  <line class="ww-anno-line" x1="530" y1="394" x2="530" y2="406" />
                  <text class="ww-anno-text is-center" x="430" y="428">base &asymp; &frac12; circumference</text>

                  <line class="ww-anno-line" x1="675" y1="165" x2="675" y2="315" />
                  <line class="ww-anno-line" x1="669" y1="165" x2="681" y2="165" />
                  <line class="ww-anno-line" x1="669" y1="315" x2="681" y2="315" />
                  <text class="ww-anno-text" x="690" y="245">height &asymp; radius</text>
                </g>

                <line class="ww-track" x1="230" y1="460" x2="630" y2="460" />
                <g id="ww-ticks"></g>

                <g id="ww-hint">
                  <circle id="ww-hint-ring" class="ww-hint-ring" cx="230" cy="460" r="26" />
                  <text id="ww-hint-text" class="ww-hint-text" x="230" y="424">Drag me</text>
                </g>

                <circle id="ww-handle" class="ww-handle" cx="230" cy="460" r="20" />

          <p class="question-text">1. Follow the steps to decompose the circle and then compose it into a new figure.</p>

      </div>
      <script>
        (function () {
          const svg = document.getElementById("ww-svg");
          // The host re-seeks this sub-composition every time its slide becomes
          // visible again, which can re-run this script. Guard so a revisit never
          // rebuilds the wedge states or duplicates ticks/listeners.
          if (svg.dataset.hfInit === "true") return;
          svg.dataset.hfInit = "true";

          const NS = "http://www.w3.org/2000/svg";
          const R_BASE = 130;
          const CENTER = { x: 430, y: 240 };

          function wedgeLocalPath(R, theta) {
            const half = theta / 2;
            const x1 = -R * Math.sin(half),
              y1 = R * Math.cos(half);
            const x2 = R * Math.sin(half),
              y2 = R * Math.cos(half);
            const largeArc = theta > Math.PI ? 1 : 0;
            return `M 0 0 L ${x1.toFixed(3)} ${y1.toFixed(3)} A ${R} ${R} 0 ${largeArc} 1 ${x2.toFixed(3)} ${y2.toFixed(3)} Z`;
          }

          function buildCircleState() {
            const g = document.createElementNS(NS, "g");
            g.setAttribute("class", "state");
            g.setAttribute("data-state", "circle");
            const c = document.createElementNS(NS, "circle");
            c.setAttribute("class", "ww-circle-outline");
            c.setAttribute("cx", CENTER.x);
            c.setAttribute("cy", CENTER.y);
            c.setAttribute("r", R_BASE);
            g.appendChild(c);
            return g;
          }

          function buildRowState(n) {
            const g = document.createElementNS(NS, "g");
            g.setAttribute("class", "state");
            g.setAttribute("data-state", "n" + n);
            const theta = (2 * Math.PI) / n;
            const W = 2 * R_BASE * Math.sin(theta / 2);
            const totalWidth = n * W;
            const scale = Math.min(2.2, 480 / totalWidth);
            const outer = document.createElementNS(NS, "g");
            outer.setAttribute("transform", `translate(${CENTER.x},${CENTER.y}) scale(${scale})`);
            const inner = document.createElementNS(NS, "g");
            const d = wedgeLocalPath(R_BASE, theta);
            for (let i = 0; i < n; i++) {
              const x = i * W - totalWidth / 2 + W / 2;
              const p = document.createElementNS(NS, "path");
              p.setAttribute("class", "ww-wedge");
              p.setAttribute("d", d);
              const flip = i % 2 === 1 ? " scale(1,-1)" : "";
              p.setAttribute("transform", `translate(${x.toFixed(3)},0)${flip}`);
              inner.appendChild(p);
            }
            outer.appendChild(inner);
            g.appendChild(outer);
            return g;
          }

          const stateDefs = [
            { key: "circle", x: 230, label: "Circle", build: buildCircleState },
            { key: "n4", x: 330, label: "4 sectors", build: () => buildRowState(4) },
            { key: "n8", x: 430, label: "8 sectors", build: () => buildRowState(8) },
            { key: "n16", x: 530, label: "16 sectors", build: () => buildRowState(16) },
            { key: "n32", x: 630, label: "32 sectors — almost a rectangle!", build: () => buildRowState(32) },
          ];

          const statesLayer = document.getElementById("ww-states");
          stateDefs.forEach((s, i) => {
            const g = s.build();
            g.style.opacity = i === 0 ? "1" : "0";
            statesLayer.appendChild(g);
            s.el = g;
          });

          // Ticks, built from the same stateDefs so positions can never drift
          // out of sync with the states they label.
          const ticksLayer = document.getElementById("ww-ticks");
          const tickLabelEls = [];
          stateDefs.forEach((s, i) => {
            const mark = document.createElementNS(NS, "line");
            mark.setAttribute("class", "ww-tick-mark");
            mark.setAttribute("x1", s.x);
            mark.setAttribute("x2", s.x);
            mark.setAttribute("y1", 454);
            mark.setAttribute("y2", 466);
            ticksLayer.appendChild(mark);

            const label = document.createElementNS(NS, "text");
            label.setAttribute("class", "ww-tick-label");
            label.setAttribute("x", s.x);
            label.setAttribute("y", 492);
            label.textContent = s.key === "circle" ? "Circle" : s.key.slice(1);
            label.classList.toggle("is-active", i === 0);
            ticksLayer.appendChild(label);
            tickLabelEls.push(label);
          });

          const annoGroup = document.getElementById("ww-annotations");
          const liveLabel = document.getElementById("ww-live-label");
          const handle = document.getElementById("ww-handle");
          const hintGroup = document.getElementById("ww-hint");

          let currentIndex = 0;

          function nearestIndexForX(x) {
            let best = 0,
              bestDist = Infinity;
            stateDefs.forEach((s, i) => {
              const dist = Math.abs(x - s.x);
              if (dist < bestDist) {
                bestDist = dist;
                best = i;
              }
            });
            return best;
          }

          function applyState(index) {
            if (index === currentIndex) return;
            const prev = stateDefs[currentIndex];
            const next = stateDefs[index];
            gsap.to(prev.el, { opacity: 0, duration: 0.35 });
            gsap.to(next.el, { opacity: 1, duration: 0.35 });
            liveLabel.textContent = next.label;
            tickLabelEls.forEach((t, i) => t.classList.toggle("is-active", i === index));
            const showAnno = index >= 3; // n16, n32
            gsap.to(annoGroup, { opacity: showAnno ? 1 : 0, duration: 0.35 });
            currentIndex = index;
          }

          function setHandleX(x) {
            handle.setAttribute("cx", x);
          }

          function pointFromEvent(evt) {
            const pt = svg.createSVGPoint();
            pt.x = evt.clientX;
            pt.y = evt.clientY;
            return pt.matrixTransform(svg.getScreenCTM().inverse());
          }

          let dragging = false;
          let hintDismissed = false;

          function dismissHint() {
            if (hintDismissed) return;
            hintDismissed = true;
            // GSAP, not a CSS transition: this is the only way to guarantee the
            // hint actually disappears under deterministic-seek rendering.
            gsap.to(hintGroup, {
              opacity: 0,
              duration: 0.3,
              onComplete: () => {
                hintGroup.style.display = "none";
              },
            });
          }

          handle.addEventListener("pointerdown", (evt) => {
            dragging = true;
            handle.classList.add("is-dragging");
            handle.setPointerCapture(evt.pointerId);
            dismissHint();
          });
          handle.addEventListener("pointermove", (evt) => {
            if (!dragging) return;
            const p = pointFromEvent(evt);
            const clampedX = Math.max(230, Math.min(630, p.x));
            setHandleX(clampedX);
            const idx = nearestIndexForX(clampedX);
            if (idx !== currentIndex) applyState(idx);
          });
          handle.addEventListener("pointerup", (evt) => {
            dragging = false;
            handle.classList.remove("is-dragging");
            handle.releasePointerCapture(evt.pointerId);
            gsap.to(handle, { attr: { cx: stateDefs[currentIndex].x }, duration: 0.2, ease: "power2.out" });
          });
          handle.addEventListener("pointercancel", () => {
            dragging = false;
            handle.classList.remove("is-dragging");
          });

          // Initial render: default visible state immediately, no opacity-from-0 reveal.
          setHandleX(stateDefs[0].x);
          liveLabel.textContent = stateDefs[0].label;

          // Draws itself in on first load: handle slides from the circle stop to
          // the n8 stop, then the user takes over. Driven by a single GSAP tween
          // on a progress proxy, never requestAnimationFrame/performance.now().
          let introStarted = false;
          function runIntro() {
            if (introStarted) return;
            introStarted = true;
            const proxy = { x: stateDefs[0].x };
            gsap.to(proxy, {
