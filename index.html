<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bluebonnet-7th-grade-lesson1-deck — Presenter</title>
    <script>
      // Retitle the audience tab so the two tabs are distinguishable in the
      // browser tab strip and in Meet's "Share a tab" picker.
      if (new URLSearchParams(location.search).get("mode") === "audience") {
        document.title = "bluebonnet-7th-grade-lesson1-deck" + " — Audience";
      }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: #0a0a0a; overflow: hidden; }
      hyperframes-slideshow { display: block; position: relative; width: 100vw; height: 100vh; }
      hyperframes-player { position: absolute; inset: 0; }
    </style>
    <script src="player.js"></script>
    <script src="slideshow.js"></script>
  </head>
  <body>
    <hyperframes-slideshow tabindex="0" sound>
      <hyperframes-player interactive src="composition/index.html"></hyperframes-player>
      <script type="application/hyperframes-slideshow+json">
{
        "slides": [
          { "sceneId": "title", "notes": "Welcome slide. Grade 7, Module 1, Topic 1, Lesson 1." },
          { "sceneId": "today", "notes": "State today's exploration goal in one sentence." },
          { "sceneId": "sh-getting-started", "notes": "Getting Started, 7-10 min: Across and Around." },
          { "sceneId": "getting-started", "notes": "Students measure circumference with string and radius with a ruler." },
          { "sceneId": "synth-getting-started", "notes": "Close: distance from center to any point on a circle is constant." },
          { "sceneId": "sh-1-1", "notes": "Activity 1.1, 10-15 min: Analyzing the Parts of a Circle." },
          { "sceneId": "activity-1-1", "notes": "Define circle, radius, diameter, circumference." },
          { "sceneId": "synth-1-1", "notes": "Close: radius is half the diameter." },
          { "sceneId": "sh-1-2", "notes": "Activity 1.2, 15-20 min: Measuring the Distance Around a Circle." },
          { "sceneId": "activity-1-2", "notes": "Walk the data table; every ratio lands near 3.14." },
          { "sceneId": "synth-1-2", "notes": "Close: C/d is approximately 3.14 for any circle." },
          { "sceneId": "sh-1-3", "notes": "Activity 1.3, 25-30 min: The Circumference Formula." },
          { "sceneId": "activity-1-3", "notes": "Introduce C = pi*d and C = 2*pi*r with worked numbers." },
          { "sceneId": "synth-1-3", "notes": "Close: both formulas compute circumference." },
          { "sceneId": "learning-targets", "notes": "Checkpoint against the lesson's I can statements." },
          { "sceneId": "sh-talk", "notes": "Talk the Talk, 10-15 min: Twice." },
          { "sceneId": "talk-the-talk", "notes": "Compare a 2 cm radius circle to a 2 cm diameter circle." },
          { "sceneId": "synth-talk", "notes": "Close: the ratio stays pi regardless of size." },
          { "sceneId": "glossary-term", "notes": "Hold on the term pi before defining it." },
          { "sceneId": "glossary-def", "notes": "Define pi and walk the Circle O worked example." },
          { "sceneId": "attribution", "notes": "Internal attribution slide, not legally authoritative." },
          { "sceneId": "closing", "notes": "End on the Grade 7 mark." }
        ]
      }
      </script>
    </hyperframes-slideshow>
    <!-- Present CTA lives in the component's nav cluster (data-hf-present, plus
         the P key) — no page-level button, or we'd render two Present CTAs. -->
    <script>
      // Sound effects play HERE, in the parent document. The composition runs in the
      // player's iframe, which is autoplay-blocked without its own user gesture; the
      // slideshow posts { type: "hf-sfx", name } to the parent on nav, and we play the
      // matching clip from the deck's sfx/ folder (served under /composition/sfx/).
      // Runs in both presenter and audience windows. Missing clips fail silently.
      (function () {
        var clips = {
          advance: new Audio("composition/sfx/advance.mp3"),
          fragment: new Audio("composition/sfx/fragment.mp3"),
          "branch-enter": new Audio("composition/sfx/branch-enter.mp3"),
          back: new Audio("composition/sfx/back.mp3"),
        };
        clips.advance.volume = 0.45;
        clips.fragment.volume = 0.4;
        clips["branch-enter"].volume = 0.4;
        clips.back.volume = 0.4;
        for (var k in clips) clips[k].preload = "auto";

        // Mute state is owned by <hyperframes-slideshow sound>; mirror it.
        var muted = false;
        function setClipsMuted(nextMuted) {
          Object.keys(clips).forEach(function (name) {
            clips[name].muted = nextMuted;
          });
        }
        var ss = document.querySelector("hyperframes-slideshow");
        if (ss) {
          ss.addEventListener("hf-sound", function (e) {
            muted = e.detail && e.detail.muted === true;
            setClipsMuted(muted);
          });
        }

        // Autoplay needs a user gesture — prime each clip (play muted, reset) on the
        // first interaction so later plays are instant and allowed.
        var unlocked = false;
        function unlock() {
          if (unlocked) return;
          unlocked = true;
          Object.keys(clips).forEach(function (name) {
            var el = clips[name];
            var v = el.volume;
            el.volume = 0;
            el.play()
              .then(function () {
                el.pause();
                el.currentTime = 0;
                el.volume = v;
              })
              .catch(function () {
                el.volume = v;
              });
          });
        }
        window.addEventListener("keydown", unlock, true);
        window.addEventListener("pointerdown", unlock, true);
        window.addEventListener("click", unlock, true);

        window.addEventListener("message", function (e) {
          // Only accept cues from this origin (the composition iframe is same-origin).
          if (e.origin !== location.origin) return;
          var d = e.data;
          if (!d || d.type !== "hf-sfx" || muted) return;
          // Own-property guard: a malicious name like "__proto__" must not resolve to
          // a prototype object (which would be truthy and then get mutated below).
          if (!Object.prototype.hasOwnProperty.call(clips, d.name)) return;
          var el = clips[d.name];
          if (!el || !unlocked) return;
          try {
            el.currentTime = 0;
            el.play().catch(function () {});
          } catch (err) {
            /* ignore */
          }
        });
      })();
    </script>
  </body>
</html>
